<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Streaming Studio</title>
    
    <!-- Decoupled Modular CSS Style Sheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-switch.css') }}">
    
    <!-- Production jsDelivr CDN Link for Lucide Vector Icons -->
    <script src="jsdelivr.net"></script>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- TOP SECTION: Search Utility & Celestial Switch -->
        <header class="dash-header">
            {% include 'components/search.html' %}
        </header>

        <!-- MAIN RESPONSIVE GRID -->
        <main class="dash-grid">
            
            <!-- Column 1: Audio Visualizer Card -->
            <section class="grid-card player-section">
                {% include 'components/visualizer.html' %}
            </section>

            <!-- Column 2: Interactive Lyrics Sync Panel -->
            <section class="grid-card lyrics-section">
                {% include 'components/lyrics.html' %}
            </section>

            <!-- Column 3: Playlist and Artist Context Profiles -->
            <section class="sidebar-section">
                <div class="grid-card playlist-card">
                    {% include 'components/playlist.html' %}
                </div>
                <div class="grid-card artist-card">
                    {% include 'components/artist.html' %}
                </div>
            </section>

        </main>
    </div>

    <!-- Decoupled Modular JavaScript Controllers -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
