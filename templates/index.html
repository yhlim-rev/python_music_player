<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Streaming Studio</title>
    
    <!-- Base styles, frameworks, and component styling fragments -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-switch.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/search.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/visualizer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/lyrics.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/playlist.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/artist.css') }}">
</head>
<body>

    <div class="dashboard-container">
        <header class="dash-header">
            {% include 'components/search.html' %}
        </header>

        <main class="dash-grid">
            <section class="grid-card player-section">
                {% include 'components/visualizer.html' %}
            </section>

            <section class="grid-card lyrics-section">
                {% include 'components/lyrics.html' %}
            </section>

            <section class="sidebar-section">
                <div class="grid-card playlist-card">
                    {% include 'components/playlist.html' %}
                </div>
                <div class="grid-card artist-card">
                    {% include 'components/artist.html' %}
                </div>
            </section>
        </main>
    </div>

    <!-- Core engines initialized first -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player-core.js') }}"></script>
    
    <!-- Decoupled script handlers tracking component-specific bindings -->
    <script src="{{ url_for('static', filename='js/components/search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/visualizer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/lyrics.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/playlist.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/artist.js') }}"></script>
</body>
</html>
