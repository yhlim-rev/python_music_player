<div class="visualizer-container" id="visualizer">
    <!-- 12 Dynamic responsive equalizer waves -->
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
</div>

<h1 class="song-title" id="song-title">Loading Track...</h1>
<p class="artist-name" id="artist-name">Loading Artist...</p>

<div class="slider-container">
    <input type="range" id="progress" class="progress-slider" min="0" max="100" value="0">
    <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
    </div>
</div>

<div class="controls">
    <!-- Master button initialized with native raw inline play SVG -->
    <button id="btn-master" class="master-glow-btn" title="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
    </button>
</div>
<div class="status-badge-container">
    <span class="status-badge" id="status">Stopped</span>
</div>
