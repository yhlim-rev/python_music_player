<div class="header-utilities">
    <!-- Search Query Bar -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search tracks, artists, or genres...">
    </div>

    <!-- Animated Celestial Sky Switch Container -->
    <div class="theme-switch-wrapper">
        <input type="checkbox" id="theme-toggle" class="theme-checkbox">
        <label for="theme-toggle" class="theme-toggle-label">
            <div class="sky-background"></div>
            <div class="stars"></div>
            
            <!-- Floating Morning Clouds -->
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            
            <!-- Turning Toggle Knob Core -->
            <div class="celestial-body">
                <div class="crater crater-1"></div>
                <div class="crater crater-2"></div>
            </div>
        </label>
    </div>
</div>
